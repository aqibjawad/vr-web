name: VR Web CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Enable manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Clean npm cache
      run: npm cache clean --force
        
    - name: Install dependencies with legacy peer deps
      run: npm ci --legacy-peer-deps
      
    - name: Run linting
      run: npm run lint
      continue-on-error: true
      
    - name: Build project
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Build for testing
      run: npm run build
      
    - name: Test build artifacts
      run: |
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Build failed - index.html not found"
          exit 1
        fi
        echo "✅ Build artifacts validated"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
        
    - name: Verify artifacts
      run: |
        ls -la dist/
        if [ ! -f "dist/index.html" ]; then
          echo "❌ No build artifacts found"
          exit 1
        fi
        
    - name: Create server backup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🔄 Creating backup of current deployment..."
          
          # Create backup directory if it doesn't exist
          sudo mkdir -p /var/www/aaai.global/backups
          
          # Create backup if current deployment exists
          if [ -d "/var/www/aaai.global/dist" ]; then
            BACKUP_NAME="dist.backup.$(date +%Y%m%d_%H%M%S)"
            sudo cp -r /var/www/aaai.global/dist /var/www/aaai.global/backups/$BACKUP_NAME
            echo "✅ Backup created: $BACKUP_NAME"
            
            # Keep only last 5 backups
            sudo ls -t /var/www/aaai.global/backups/ | tail -n +6 | xargs -r -I {} sudo rm -rf /var/www/aaai.global/backups/{}
          fi
          
          # Create target directory
          sudo mkdir -p /var/www/aaai.global/dist
          sudo mkdir -p /tmp/vr-web-deploy/
          
    - name: Upload files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "dist/*"
        target: "/tmp/vr-web-deploy/"
        strip_components: 1
        
    - name: Deploy and verify
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Starting deployment..."
          
          # Verify uploaded files
          if [ ! -f "/tmp/vr-web-deploy/index.html" ]; then
            echo "❌ Upload failed - no files found in temp directory"
            exit 1
          fi
          
          # Move files to final location
          sudo rsync -av --delete /tmp/vr-web-deploy/ /var/www/aaai.global/dist/
          
          # Set proper permissions
          sudo chown -R www-data:www-data /var/www/aaai.global/dist
          sudo chmod -R 755 /var/www/aaai.global/dist
          
          # Verify deployment
          if [ -f "/var/www/aaai.global/dist/index.html" ]; then
            echo "✅ Deployment successful!"
            echo "📁 Files deployed to /var/www/aaai.global/dist/"
            echo "🌐 Available at https://aaai.global"
          else
            echo "❌ Deployment verification failed!"
            
            # Restore from backup if available
            LATEST_BACKUP=$(sudo ls -t /var/www/aaai.global/backups/ | head -n 1)
            if [ ! -z "$LATEST_BACKUP" ]; then
              echo "🔄 Restoring from backup: $LATEST_BACKUP"
              sudo rm -rf /var/www/aaai.global/dist
              sudo cp -r /var/www/aaai.global/backups/$LATEST_BACKUP /var/www/aaai.global/dist
              sudo chown -R www-data:www-data /var/www/aaai.global/dist
            fi
            exit 1
          fi
          
          # Clean up temp directory
          sudo rm -rf /tmp/vr-web-deploy/
          
          # Optional: Test if nginx needs reload
          sudo nginx -t && echo "✅ Nginx config is valid"
          
          echo "🎉 Deployment completed successfully!"
          
  manual-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Build project
      run: npm run build
      
    - name: Verify build
      run: |
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Build failed"
          exit 1
        fi
        echo "✅ Build completed successfully"
        
    - name: Manual deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Starting manual deployment..."
          
          # Create backup
          if [ -d "/var/www/aaai.global/dist" ]; then
            sudo mkdir -p /var/www/aaai.global/backups
            BACKUP_NAME="dist.backup.manual.$(date +%Y%m%d_%H%M%S)"
            sudo cp -r /var/www/aaai.global/dist /var/www/aaai.global/backups/$BACKUP_NAME
            echo "✅ Manual backup created: $BACKUP_NAME"
          fi
          
          # Create directories
          sudo mkdir -p /var/www/aaai.global/dist
          sudo mkdir -p /tmp/vr-web-manual-deploy/
          
    - name: Upload files for manual deploy
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "dist/*"
        target: "/tmp/vr-web-manual-deploy/"
        strip_components: 1
        
    - name: Finalize manual deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # Move files
          sudo rsync -av --delete /tmp/vr-web-manual-deploy/ /var/www/aaai.global/dist/
          
          # Set permissions  
          sudo chown -R www-data:www-data /var/www/aaai.global/dist
          sudo chmod -R 755 /var/www/aaai.global/dist
          
          # Cleanup
          sudo rm -rf /tmp/vr-web-manual-deploy/
          
          # Verify deployment
          if [ -f "/var/www/aaai.global/dist/index.html" ]; then
            echo "✅ Manual deployment completed successfully!"
            echo "📁 Files deployed to /var/www/aaai.global/dist/"
            echo "🌐 Available at https://aaai.global"
          else
            echo "❌ Manual deployment verification failed!"
            exit 1
          fi
          
  notify:
    needs: [build, test, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ **Status**: Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **URL**: https://aaai.global" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
          echo "⏭️ **Status**: Deployment Skipped (not main branch)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status**: Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Check logs and backups are available on server" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Target**: /var/www/aaai.global/dist/" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Test Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deploy Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
        
  cleanup:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            console.log(`Found ${artifacts.artifacts.length} total artifacts`);
            
            // Sort by created date (newest first)
            const sortedArtifacts = artifacts.artifacts.sort((a, b) => 
              new Date(b.created_at) - new Date(a.created_at)
            );
            
            // Keep only the latest 10 artifacts
            const artifactsToDelete = sortedArtifacts.slice(10);
            
            console.log(`Keeping ${Math.min(10, sortedArtifacts.length)} artifacts`);
            console.log(`Deleting ${artifactsToDelete.length} old artifacts`);
            
            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                console.log(`✅ Deleted artifact: ${artifact.name} (${artifact.created_at})`);
              } catch (error) {
                console.log(`❌ Failed to delete artifact ${artifact.name}: ${error.message}`);
              }
            }
            
            console.log('🧹 Cleanup completed');
          } catch (error) {
            console.log(`❌ Cleanup failed: ${error.message}`);
          }